<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto — {tienda}</title>
    <meta name="description" content="Datos de contacto, horarios y ubicación. Escribinos por WhatsApp o Facebook.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Contacto">
    <meta property="og:description" content="Escribinos por WhatsApp o Facebook.">
    <meta property="og:image" content="assets/img/placeholder.svg">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>
<body class="page" data-page="contacto">

    <header class="band band-dark band-slim page-topbar">
        <div class="container">
            <div class="topbar">
                <div data-brand></div>
                <nav class="nav">
                    <ul>
                        <li><a href="index.html">Catálogo</a></li>
                        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="band band-dark page-heading">
        <div class="container">
            <div class="page-title">
                <h1>Contacto</h1>
            </div>
        </div>
    </div>

    <main class="page-main" data-main>
        <div class="container">
            <section class="section">
                <div class="section-header">
                    <div class="section-subtitle" data-tienda-descripcion></div>
                </div>

                <div class="section-body">
                    <div class="contact">
                        <div class="contact-panel">
                            <div class="section-title">
                                <h2>Datos</h2>
                            </div>
                            <div data-contacto></div>
                            <div class="btn-group" data-contacto-botones></div>
                        </div>

                        <div class="contact-panel">
                            <div class="section-title">
                                <h2>Horarios de atención</h2>
                            </div>
                            <div data-horarios></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="band band-dark page-footer">
        <div class="container" data-footer></div>
    </footer>

    <div class="actionbar" data-actionbar></div>

    <script src="assets/js/render.js"></script>
    <script src="assets/js/app.js"></script>
