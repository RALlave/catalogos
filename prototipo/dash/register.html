<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta — Catálogos</title>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/css/themes.css">
    <script>
        (function () {
            var theme = window.localStorage.getItem("dash.theme");

            if (theme && theme !== "cacao") {
                document.documentElement.setAttribute("data-theme", theme);
            }
        })();
    </script>
</head>

<body>
    <main class="auth">
        <div class="auth-brand">
            <span class="brand-mark">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9h18l-1.5 10.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5Z" />
                    <path d="M8 9V6a4 4 0 0 1 8 0v3" />
                </svg>
            </span>
            <strong>Catálogos</strong>
        </div>

        <section class="auth-card">
            <header class="auth-head">
                <h1>Creá tu cuenta</h1>
                <p>Publicá tu catálogo en minutos, sin costo</p>
            </header>

            <form class="form" data-fake-submit="verificar-email.html" novalidate>
                <div class="field">
                    <div class="field-label">
                        <label for="register-name">Nombre y apellido</label>
                    </div>
                    <input class="input" type="text" id="register-name" name="name" placeholder="Rafael Albino" autocomplete="name" required>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="register-store">Nombre de tu tienda</label>
                    </div>
                    <input class="input" type="text" id="register-store" name="store" placeholder="Mi Tienda" required>
                    <div class="field-hint">
                        <p>Tu catálogo quedará en catalogo.com/mi-tienda</p>
                    </div>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="register-email">Correo electrónico</label>
                    </div>
                    <input class="input" type="email" id="register-email" name="email" placeholder="tunombre@correo.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <div class="field-label">
                        <label for="register-password">Contraseña</label>
                    </div>
                    <div class="input-group">
                        <input class="input" type="password" id="register-password" name="password" placeholder="••••••••" autocomplete="new-password" required>
                        <button class="input-group-action" type="button" data-password-toggle="register-password" aria-label="Mostrar contraseña">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>
                    <div class="strength" data-strength-for="register-password">
                        <div class="strength-bars">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div class="strength-label" data-strength-label>Usá al menos 8 caracteres, con mayúsculas y números</div>
                    </div>
                </div>

                <label class="check">
                    <input type="checkbox" name="terms" required>
                    <span>Acepto los términos y la política de privacidad</span>
                </label>

                <button class="btn btn-primary btn-lg btn-block" type="submit">Crear cuenta gratis</button>
            </form>

            <div class="auth-divider">o</div>

            <div class="auth-alt">
                <p>¿Ya tenés cuenta? <span class="auth-link"><a href="login.html">Iniciá sesión</a></span></p>
            </div>
        </section>

        <footer class="auth-footer">
            <a href="#">Términos</a>
            <a href="#">Privacidad</a>
            <a href="#">Ayuda</a>

            <div class="theme-picker">
                <button type="button" data-theme-set="cacao" aria-label="Tema Cacao">
                    <span class="theme-swatch theme-cacao">
                        <span></span>
                        <span></span>
                    </span>
                </button>
                <button type="button" data-theme-set="oceano" aria-label="Tema Océano">
                    <span class="theme-swatch theme-oceano">
                        <span></span>
                        <span></span>
                    </span>
                </button>
                <button type="button" data-theme-set="grafito" aria-label="Tema Grafito">
                    <span class="theme-swatch theme-grafito">
                        <span></span>
                        <span></span>
                    </span>
                </button>
            </div>
        </footer>
    </main>

    <div class="toast-stack" data-toast-stack></div>

    <script src="assets/js/app.js"></script>
</body>

</html>
