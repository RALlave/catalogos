# =============================================================================
#  miotienda.com — landing + puerta de entrada al panel
#
#  CloudPanel genera y administra este vhost: acá sólo está el bloque que hay
#  que AGREGAR a mano, no el archivo entero.
#
#  Dónde: CloudPanel → Sites → miotienda.com → Vhost, dentro del server block
#  que escucha en 443 (el que tiene "root /home/miotienda-apex/...").
#  Pegar junto a los otros location, antes del "location /".
#
#  Antes, en CloudPanel → Sites → miotienda.com → Settings:
#      Root Directory: htdocs/miotienda.com/landing
#
#  OJO: CloudPanel regenera el vhost al reinstalar un certificado o al cambiar
#  la configuración del sitio, y se lleva puesto este bloque. Si el panel deja
#  de responder en /login después de tocar algo en CloudPanel, es esto.
# =============================================================================

# Rutas del panel. No comparten prefijo con la landing, así que se nombran una
# por una: cualquier otra cosa la sirve la landing desde el root del sitio.
#
# Acá viven /registro y /superadmin, que en el subdominio de una tienda no
# existen: una cuenta nueva se crea en el dominio principal.
# El "try_files /index.html =404" no es un try_files de SPA cualquiera: el
# fallback tiene que buscarse como ARCHIVO del root de este location. Escrito
# como "try_files $uri /index.html", nginx trata el último parámetro como una
# URI y vuelve a empezar con /index.html, que ya no matchea este location: cae
# en el root del sitio y sirve la landing en vez del panel.
location ~ ^/(login|registro|recuperar|restablecer|admin|superadmin)(/|$) {
    root /home/miotienda-apex/htdocs/miotienda.com/panel/dist;
    try_files /index.html =404;
}

# Los archivos del panel cuelgan de /panel/ (VITE_BASE), aunque sus rutas vivan
# en la raíz. Son dos cosas distintas y es el error más común del deploy.
# El nombre de cada archivo lo pone el build, así que no cambia sin cambiar de
# contenido: se pueden cachear para siempre.
#
# El "^~" no es decorativo: el vhost de CloudPanel trae más abajo un
# "location ~* \.(css|js|...)$", y en nginx una expresión regular le gana a un
# prefijo. Sin "^~", los archivos del panel los atiende esa regex, que resuelve
# contra el root del sitio (landing/) y devuelve 404: el panel carga el HTML
# pero se queda sin CSS ni JavaScript.
location ^~ /panel/ {
    alias /home/miotienda-apex/htdocs/miotienda.com/panel/dist/;

    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# El panel se instala como aplicación de escritorio, y sus dos archivos de PWA
# tienen que responder en la RAÍZ del dominio aunque el build los deje dentro
# de /panel/: un service worker sólo alcanza a las rutas que cuelgan de su
# propia carpeta, y las del panel (/login, /superadmin) están en la raíz.
#
# Sin caché: el manifest cambia de contenido sin cambiar de nombre, y un
# service worker cacheado deja al navegador con el de la versión anterior.
location = /manifest.webmanifest {
    alias /home/miotienda-apex/htdocs/miotienda.com/panel/dist/manifest.webmanifest;

    add_header Cache-Control "no-cache";
}

location = /sw.js {
    alias /home/miotienda-apex/htdocs/miotienda.com/panel/dist/sw.js;

    add_header Cache-Control "no-cache";
}
