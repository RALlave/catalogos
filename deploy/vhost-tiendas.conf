# =============================================================================
#  *.miotienda.com — catálogo de cada tienda + el panel de su dueño
#
#  CloudPanel generó este sitio como "tiendas.miotienda.com" y el server_name
#  está editado a mano a "*.miotienda.com". Acá sólo está lo que hay que
#  AGREGAR, no el archivo entero.
#
#  Dónde: CloudPanel → Sites → tiendas.miotienda.com → Vhost, dentro del server
#  block que escucha en 443. Los location de abajo van ANTES del "location /"
#  que ya trae el sitio (el que hace proxy a 127.0.0.1:3000).
#
#  El orden en el archivo no decide nada: nginx elige el location más
#  específico y las expresiones regulares ganan sobre los prefijos. Se ponen
#  arriba sólo para que se lean primero.
#
#  OJO: dos ediciones a mano conviven en este vhost — el server_name wildcard y
#  este bloque. CloudPanel se lleva las dos puestas al regenerar el vhost
#  (reinstalar un certificado, cambiar la configuración del sitio). Si de un día
#  para otro las tiendas dan 404 o el panel no abre, revisar esto primero.
# =============================================================================

# Panel del dueño de la tienda. /registro y /superadmin NO están: una cuenta
# nueva se crea en el dominio principal, y el superadmin no entra por acá.
location ~ ^/(login|recuperar|restablecer|admin)(/|$) {
    root /home/miotienda-tiendas/htdocs/tiendas.miotienda.com/panel/dist;
    try_files $uri /index.html;
}

# Los archivos del panel cuelgan de /panel/ (VITE_BASE), aunque sus rutas vivan
# en la raíz. Sin esto el panel pide su JavaScript a la raíz, contesta Nuxt con
# el catálogo y la pantalla queda en blanco.
location /panel/ {
    alias /home/miotienda-tiendas/htdocs/tiendas.miotienda.com/panel/dist/;

    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Los assets que compila Nuxt tampoco cambian de nombre sin cambiar de
# contenido. Siguen saliendo del proceso Node, pero cacheados en el navegador.
location /_nuxt {
    proxy_pass http://127.0.0.1:3000;

    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# -----------------------------------------------------------------------------
#  Y en el "location /" que ya trae CloudPanel, cambiar una sola línea:
#
#      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#  por
#      proxy_set_header X-Forwarded-For $remote_addr;
#
#  StatService cuenta la visita leyendo el primer valor de X-Forwarded-For. Con
#  $proxy_add_x_forwarded_for, nginx antepone lo que haya mandado el cliente:
#  cualquiera podría mandarse un header falso e inflar las estadísticas de una
#  tienda ajena. Con $remote_addr viaja la IP que resolvió real_ip, y esa no se
#  falsifica. Lo mismo vale para el vhost de api.miotienda.com.
# -----------------------------------------------------------------------------
