# =============================================================================
#  diseprog.com — las tres apps bajo un solo dominio
#
#    /api      → Laravel   (api/public)
#    /panel    → Vue SPA   (panel/dist, archivos estáticos)
#    /         → Nuxt SSR  (proceso Node en el puerto 3000, levantado con PM2)
#
#  El orden importa: nginx elige el location más específico, así que /api y
#  /panel ganan sobre / y nunca llegan a Nuxt.
#
#  Copiar a /etc/nginx/sites-available/diseprog.com y enlazar en sites-enabled.
#  El bloque de SSL lo agrega certbot solo al correr:
#      certbot --nginx -d diseprog.com -d www.diseprog.com
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    server_name diseprog.com www.diseprog.com;

    # Ruta del proyecto en el VPS. Cambiar si lo dejás en otro lado.
    set $project /var/www/catalogos;

    charset utf-8;
    client_max_body_size 12M;          # las imágenes de producto pesan hasta 4M

    access_log /var/log/nginx/diseprog.access.log;
    error_log  /var/log/nginx/diseprog.error.log;

    # -------------------------------------------------------------------------
    #  API — Laravel
    # -------------------------------------------------------------------------
    location /api {
        alias $project/api/public;
        try_files $uri $uri/ @laravel;

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # Todo lo que no sea un archivo real dentro de /api lo resuelve Laravel.
    location @laravel {
        rewrite ^/api/(.*)$ /api/index.php?/$1 last;
    }

    location = /api/index.php {
        alias $project/api/public/index.php;

        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    # -------------------------------------------------------------------------
    #  Imágenes subidas (storage:link) — se sirven directo, sin pasar por PHP
    # -------------------------------------------------------------------------
    location /api/storage {
        alias $project/api/public/storage;

        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # -------------------------------------------------------------------------
    #  Panel — SPA de Vue ya compilada
    # -------------------------------------------------------------------------
    location /panel {
        alias $project/panel/dist;

        # Cualquier ruta interna de la SPA la resuelve su propio index.html.
        try_files $uri $uri/ /panel/index.html;
    }

    location /panel/assets {
        alias $project/panel/dist/assets;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------------
    #  Catálogo público — Nuxt en modo SSR
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }

    # Los assets que compila Nuxt no cambian de nombre sin cambiar de contenido.
    location /_nuxt {
        proxy_pass http://127.0.0.1:3000;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
