# =============================================================================
#  miotienda.com — una tienda por subdominio
#
#    miotienda.com            landing + login del superadmin
#    *.miotienda.com          catálogo de cada tienda + su panel
#    api.miotienda.com        Laravel
#
#  Reemplazar "miotienda.com" por el dominio real en los tres server_name.
#
#  Copiar a /etc/nginx/sites-available/miotienda.com y enlazar en
#  sites-enabled. El certificado NO se emite con certbot: el dominio está en
#  Cloudflare, que da el wildcard gratis. Ver DEPLOY.md.
# =============================================================================

# -----------------------------------------------------------------------------
#  IP real del visitante — OBLIGATORIO detrás de Cloudflare
#
#  Sin esto, $remote_addr es una IP de Cloudflare y el primer valor de
#  X-Forwarded-For pasa a ser un dato que el visitante escribe: cualquiera
#  podría inflar las estadísticas de una tienda ajena.
#
#  La lista de rangos se actualiza: https://www.cloudflare.com/ips/
# -----------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;


# =============================================================================
#  API — Laravel en su propio subdominio
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name api.miotienda.com;

    root /var/www/catalogos/api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 12M;          # las imágenes de producto pesan hasta 4M

    access_log /var/log/nginx/api.access.log;
    error_log  /var/log/nginx/api.error.log;

    # Imágenes subidas (php artisan storage:link). Se sirven sin pasar por PHP.
    location /storage {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}


# =============================================================================
#  Dominio principal — landing y puerta de entrada
#
#  Acá entra el superadmin y también el dueño que todavía no creó su tienda:
#  por eso /admin existe en los dos lados.
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name miotienda.com www.miotienda.com;

    set $project /var/www/catalogos;

    charset utf-8;

    access_log /var/log/nginx/apex.access.log;
    error_log  /var/log/nginx/apex.error.log;

    root $project/landing;
    index index.html;

    # Rutas del panel. No comparten prefijo con el catálogo, así que se
    # nombran una por una: cualquier otra cosa es la landing.
    location ~ ^/(login|registro|recuperar|restablecer|admin|superadmin)(/|$) {
        root $project/panel/dist;
        try_files $uri /index.html;
    }

    # Los archivos del panel cuelgan de /panel/ (VITE_BASE), aunque sus rutas
    # vivan en la raíz. El nombre lo pone el build, así que no cambia sin
    # cambiar de contenido.
    location /panel/ {
        alias $project/panel/dist/;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}


# =============================================================================
#  Catálogo de cada tienda — comodín
#
#  El catálogo (Nuxt) vive en la raíz y el panel del dueño en /login y /admin.
#  El orden no decide nada acá: nginx elige el location más específico, y las
#  expresiones regulares ganan sobre los prefijos.
# =============================================================================
server {
    listen 80;
    listen [::]:80;

    server_name *.miotienda.com;

    set $project /var/www/catalogos;

    charset utf-8;

    access_log /var/log/nginx/tiendas.access.log;
    error_log  /var/log/nginx/tiendas.error.log;

    # Panel del dueño. /registro no está: una cuenta nueva se crea en el
    # dominio principal, no en el subdominio de una tienda que no es suya.
    location ~ ^/(login|recuperar|restablecer|admin)(/|$) {
        root $project/panel/dist;
        try_files $uri /index.html;
    }

    location /panel/ {
        alias $project/panel/dist/;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Los assets que compila Nuxt no cambian de nombre sin cambiar de contenido.
    location /_nuxt {
        proxy_pass http://127.0.0.1:3000;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Catálogo público — Nuxt en modo SSR, levantado con PM2.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Nuxt resuelve la tienda leyendo este header: sin él no sabe de quién
        # es el catálogo que le están pidiendo.
        proxy_set_header Host              $host;

        # Y estos dos son los que hacen que la visita se cuente. La IP ya es la
        # real gracias al bloque real_ip de arriba.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 60s;
    }
}
