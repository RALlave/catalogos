# =============================================================================
#  IP real del visitante — OBLIGATORIO detrás de Cloudflare
#
#  Sin esto, $remote_addr es una IP de Cloudflare: todas las visitas de todas
#  las tiendas se contarían como un solo visitante, y el primer valor de
#  X-Forwarded-For pasaría a ser un dato que escribe el visitante, con lo que
#  cualquiera podría inflar las estadísticas de una tienda ajena.
#
#  Instalación en el VPS (CloudPanel):
#
#    sudo cp deploy/cloudflare-realip.conf /etc/nginx/snippets/
#    sudo nano /etc/nginx/global_settings     # agregar la línea de abajo
#
#        include /etc/nginx/snippets/cloudflare-realip.conf;
#
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Va en global_settings porque CloudPanel ya lo incluye en el server block de
#  los cinco sitios: se configura una vez y vale para todos. A cambio, es un
#  archivo del panel: si una actualización de CloudPanel lo reescribe, hay que
#  volver a poner el include.
#
#  La lista de rangos cambia cada tanto: https://www.cloudflare.com/ips/
#  Última revisión: 2026-09-07
# =============================================================================

